<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>СРП Франшиза</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--surface-0); color:var(--ink); font-family:var(--font-text); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .gold { fill:var(--gold); }
  .deep { fill:var(--gold-lo); }
  .wine { fill:var(--burgundy); }
  .cream { fill:var(--ink); }
  .blk { rx:var(--radius-lg); }
  .arc { fill:none; stroke:var(--surface-0); stroke-width:2; stroke-linecap:round; }
  .node { fill:var(--surface-0); }
  .words { position:absolute; left:var(--space-6); right:var(--space-6); bottom:var(--space-6); max-width:440px; }
  .name { margin:0; font-family:var(--font-display); font-size:60px; line-height:.95; font-weight:800; letter-spacing:-.02em; color:var(--ink); }
  .tag { margin:var(--space-2) 0 0 2px; font-size:14px; line-height:20px; color:var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      gold 168×232 slab bled off the top (the one accent, largest) · burgundy 152×152 (the CTA hue) · gold-lo 136×264 bled off the right and bottom (the metal's shade) · ink 152×40 strip (relief) — about 40% of 960×288
  arrangement one tall gold slab at the left with three satellites, bottoms staggered, gutters space-4
  pattern     network arcs: five hairline arcs from one hub on the gold slab to nodes in the other blocks, cut out in the ground colour, from "a big network, one hub" — the system's single story
  scales      sides in space-2 multiples; gutters space-4; corners radius-lg; arc stroke 2px, hub 12px, nodes 6px
-->
<rect class="gold blk" x="16" y="-16" width="168" height="232"/>
<rect class="cream blk" x="200" y="16" width="152" height="40"/>
<rect class="wine blk" x="200" y="72" width="152" height="152"/>
<rect class="deep blk" x="368" y="24" width="136" height="264"/>
<path class="arc" d="M100 148 Q188 60 276 148"/>
<path class="arc" d="M100 148 Q268 16 436 96"/>
<path class="arc" d="M100 148 Q268 280 436 212"/>
<path class="arc" d="M100 148 Q170 252 276 204"/>
<path class="arc" d="M100 148 Q110 60 228 36"/>
<circle class="node" cx="100" cy="148" r="12"/>
<circle class="node" cx="276" cy="148" r="6"/>
<circle class="node" cx="436" cy="96" r="6"/>
<circle class="node" cx="436" cy="212" r="6"/>
<circle class="node" cx="276" cy="204" r="6"/>
<circle class="node" cx="228" cy="36" r="6"/>
</svg>
</div>
<div class="words">
<h1 class="name">СРП Франшиза</h1>
<p class="tag">Страницы, которые продают франшизу СРП</p>
</div>
</div>
</body>
</html>
