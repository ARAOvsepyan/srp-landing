<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>preview</title></head>
<body>
<div id="root"></div>
<script>
  var S = window.SRPF, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { style: { display: 'grid', gap: 16, padding: 24, maxWidth: 420 } },
      h(S.Field, { label: 'Имя', name: 'name', placeholder: 'Как к вам обращаться' }),
      h(S.Field, { label: 'Телефон или Telegram', name: 'contact', placeholder: '+7 ___ ___-__-__ или @username', hint: 'Свяжемся в рабочее время' }),
      h(S.Field, { label: 'Город', name: 'city', defaultValue: '', error: 'Укажите город, где хотите открыть клуб' }),
      h(S.Field, { label: 'Что вас интересует', name: 'intent', options: [{ value: 'open', label: 'Открыть новый клуб СРП' }, { value: 'have', label: 'Подключить действующий клуб' }] })));
</script>
</body>
</html>
