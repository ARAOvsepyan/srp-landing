# nginx внутри контейнера лендинга: только статика из dist/. HTTPS, домены и заголовки безопасности —
# на общем nginx сервера (deploy/nginx/landing.*.conf.tpl), сюда запросы приходят по docker-сети.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # За прокси: редиректы (например /privacy -> /privacy/) без внутреннего хоста и порта.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Имена файлов без хешей: HTML, CSS и JS каждый раз сверяются с сервером (304 по ETag),
    # иначе после выкладки у людей остаётся старая вёрстка.
    location ~* \.(?:css|js|json|xml|txt)$ {
        add_header Cache-Control "no-cache";
    }

    # Медиа меняются редко; сутки свежести и фоновая перепроверка.
    location ~* \.(?:webp|png|jpe?g|gif|svg|ico|woff2|mp4|webm|mov)$ {
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
