<!doctype html>
<!-- Исходник для public/img/og.png (1200×630). Как перегенерировать: см. README, раздел «OG-картинка». -->
<html lang="ru"><head><meta charset="utf-8">
<style>
@font-face { font-family: "Unbounded"; src: url("/fonts/Unbounded-Variable.woff2") format("woff2"); font-weight: 300 900; }
@font-face { font-family: "Golos Text"; src: url("/fonts/GolosText-Variable.woff2") format("woff2"); font-weight: 400 900; }
* { box-sizing: border-box; margin: 0; }
body { width: 1200px; height: 630px; overflow: hidden; background: #0a0908; color: #f3eee2; font-family: "Golos Text", sans-serif; position: relative; }
.bg { position: absolute; inset: 0; background:
  radial-gradient(ellipse 60% 70% at 78% 50%, rgba(220,199,127,.16), transparent 70%),
  repeating-linear-gradient(60deg, transparent 0 78px, rgba(220,199,127,.05) 78px 79px),
  repeating-linear-gradient(-60deg, transparent 0 78px, rgba(220,199,127,.05) 78px 79px); }
.map { position: absolute; left: 330px; top: -250px; width: 1800px; opacity: .95; }
.fade { position: absolute; inset: 0; background: linear-gradient(90deg, #0a0908 0%, rgba(10,9,8,.92) 38%, rgba(10,9,8,0) 72%), linear-gradient(0deg, #0a0908 0%, transparent 30%); }
.logo { position: absolute; left: 72px; top: 64px; height: 30px; }
h1 { position: absolute; left: 72px; top: 170px; width: 640px; font: 800 52px/1.12 "Unbounded"; letter-spacing: -.025em; }
h1 span { background: linear-gradient(105deg, #f6e7ac, #dcc77f 40%, #b08d3c 70%, #f1dc94); -webkit-background-clip: text; color: transparent; }
.stats { position: absolute; left: 72px; bottom: 64px; display: flex; gap: 48px; }
.stats b { display: block; font: 800 40px/1 "Unbounded"; background: linear-gradient(105deg, #f6e7ac, #dcc77f 45%, #a8873d); -webkit-background-clip: text; color: transparent; }
.stats small { display: block; margin-top: 8px; font-size: 17px; color: #aaa18d; }
.tag { position: absolute; left: 72px; top: 118px; font: 700 14px/1 "Golos Text"; letter-spacing: .2em; text-transform: uppercase; color: #dcc77f; }
</style></head>
<body>
  <div class="bg"></div>
  <img class="map" src="/img/map-russia.svg" alt="">
  <div class="fade"></div>
  <img class="logo" src="/img/logo-srp.png" alt="">
  <div class="tag">18+ · без игры на деньги</div>
  <h1>Федеральная сеть <span>спортивно-развлекательного</span> покера</h1>
  <div class="stats">
    <div><b>20+</b><small>клубов</small></div>
    <div><b>30 000+</b><small>игроков</small></div>
    <div><b>Лига городов</b><small>всероссийский финал</small></div>
  </div>
</body></html>
